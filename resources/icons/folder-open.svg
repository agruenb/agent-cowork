<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Back Folder Tab & Shadowed Interior Cavity -->
  <path d="M2.5 5.5 C2.5 4.67 3.17 4 4 4 L9 4 C9.6 4 10.15 4.35 10.4 4.9 L11.5 7 L20 7 C20.83 7 21.5 7.67 21.5 8.5 L21.5 18.5 C21.5 19.33 20.83 20 20 20 L4 20 C3.17 20 2.5 19.33 2.5 18.5 Z" fill="#b45309" stroke="#78350f" stroke-width="0.8" />
  <!-- Back Tab Lighted Face -->
  <path d="M4 4.8 C3.6 4.8 3.3 5.1 3.3 5.5 L3.3 7.8 L11 7.8 L9.9 5.5 C9.75 5.1 9.4 4.8 9 4.8 Z" fill="#d97706" />
  <!-- Deep Dark Interior Cavity (provides high contrast backdrop for the white document) -->
  <rect x="3.5" y="7.5" width="17" height="10" rx="1.5" fill="#78350f" />
  
  <!-- Interior Document / Paper Sheets with clear crisp border -->
  <!-- Back sheet -->
  <rect x="7" y="5.2" width="11" height="8.5" rx="1" fill="#f1f5f9" stroke="#94a3b8" stroke-width="0.7" />
  <!-- Front crisp white sheet with dog-ear corner fold and text lines -->
  <path d="M5 6 C5 5.45 5.45 5 6 5 L13.5 5 L17 8.5 L17 14 C17 14.55 16.55 15 16 15 L6 15 C5.45 15 5 14.55 5 14 Z" fill="#ffffff" stroke="#475569" stroke-width="0.9" />
  <!-- Dog-ear fold -->
  <path d="M13.2 5 L13.2 8.5 L16.8 8.5 Z" fill="#e2e8f0" stroke="#475569" stroke-width="0.8" stroke-linejoin="round" />
  <!-- Content lines on paper -->
  <line x1="7" y1="8.5" x2="11.5" y2="8.5" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" />
  <line x1="7" y1="11" x2="14.5" y2="11" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" />

  <!-- Folder Front Pocket / Flap (open perspective angled downwards) -->
  <path d="M2 10.5 C2 9.67 2.67 9 3.5 9 L20.5 9 C21.33 9 22 9.67 22 10.5 L20.8 18.8 C20.65 19.5 20.05 20 19.3 20 L4.7 20 C3.95 20 3.35 19.5 3.2 18.8 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1" />
  <!-- Front flap top rim highlight -->
  <path d="M3.5 9.8 L20.5 9.8 L20.3 11 L3.7 11 Z" fill="#fef08a" />
</svg>
