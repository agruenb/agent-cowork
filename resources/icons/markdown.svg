<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Antenna -->
  <line x1="12" y1="1" x2="12" y2="4.5" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="12" cy="1.5" r="1.5" fill="#4f46e5" />
  
  <!-- Left & Right Ears -->
  <rect x="1" y="9" width="3" height="7" rx="1.5" fill="#4f46e5" />
  <rect x="20" y="9" width="3" height="7" rx="1.5" fill="#4f46e5" />
  
  <!-- Robot Head Box -->
  <rect x="3.5" y="4.5" width="17" height="17" rx="3.5" fill="#4f46e5" />
  
  <!-- Smaller Crisp Eyes -->
  <circle cx="8.5" cy="11.5" r="1.5" fill="#ffffff" />
  <circle cx="15.5" cy="11.5" r="1.5" fill="#ffffff" />
  
  <!-- Simple Wide Mouth Bar -->
  <rect x="8" y="16.5" width="8" height="2" rx="1" fill="#ffffff" />
</svg>
